name: Build and Publish Container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    runs-on: ubuntu-latest
    env:
      IMAGE_VERSION: v${{ github.run_number }}.${{ github.run_attempt }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Image Name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Add Image Version to Run Summary
        shell: bash
        run: |
          {
            echo "## Container image version"
            echo
            echo "- Version: \`$IMAGE_VERSION\`"
            echo "- Image: \`$IMAGE_NAME:$IMAGE_VERSION\`"
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo "- Pull request runs build but do not publish to GHCR."
            else
              echo "- This tag is published to GHCR if the job succeeds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate Image Metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
            type=raw,value=${{ env.IMAGE_VERSION }}

      - name: Build Test Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chineseclass:test
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log In to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ env.IMAGE_VERSION }}
          cache-from: type=gha